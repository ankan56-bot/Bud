<div id="app"><div class="card mu">Laddar …</div></div>
<script>
/* Rättningsmotor för Nordisk standard (2012-08-22). Ingen AI. Regler lästa från dokumentet.
   Rattning.judge({hands:{N,E,S,W:['S14','H9',...]}, dealer:'N', bids:[{s:'N',c:'1N',e:'...'}]})
   -> {items:[{nr,plats,bud,konvention,forklaring,bedomning,battre,motivering}], summary}
   Bud: '1C'..'7N' (N = sang), 'P', 'X', 'XX'. Bedömning: rätt | fel | valfritt | ej_täckt. */
var Rattning=(function(){
var SU=['C','D','H','S'],SYM={C:'♣',D:'♦',H:'♥',S:'♠',N:'NT'},NAME={N:'Norr',E:'Öst',S:'Syd',W:'Väst'};
function side(s){return s==='N'||s==='S'?0:1}
function partner(s){return {N:'S',S:'N',E:'W',W:'E'}[s]}
function isBid(c){return /^[1-7][CDHSN]$/.test(c)}
function lv(c){return +c[0]}function st_(c){return c[1]}
function rk(c){return lv(c)*5+'CDHSN'.indexOf(c[1])}
function txt(c){return c==='P'?'Pass':(c==='X'||c==='XX')?c:c[0]+SYM[c[1]]}
function maj(s){return s==='H'||s==='S'}
function lowest(s,above){for(var l=1;l<=7;l++){var c=l+s;if(!above||rk(c)>rk(above))return c}return null}
function jump(s,above){var c=lowest(s,above);return c&&lv(c)<7?(lv(c)+1)+s:null}
function H(cards){
  var L={C:0,D:0,H:0,S:0},hp=0,top={C:[],D:[],H:[],S:[]},aces=0;
  cards.forEach(function(k){var n=+k.slice(1),s=k[0];L[s]++;top[s].push(n);if(n>=11)hp+=n-10;if(n===14)aces++});
  var sh=[L.S,L.H,L.D,L.C].sort(function(a,b){return b-a}).join('');
  var o={L:L,hp:hp,top:top,aces:aces,shape:sh,bal:['4333','4432','5332'].indexOf(sh)>=0};
  o.htp=function(t){var x=hp;SU.forEach(function(s){if(s!==t){var n=L[s];x+=n===0?3:n===1?2:n===2?1:0}});return x};
  o.has=function(s,n){return top[s].indexOf(n)>=0};
  o.stop=function(s){return o.has(s,14)||(o.has(s,13)&&L[s]>=2)||(o.has(s,12)&&L[s]>=3)||(o.has(s,11)&&L[s]>=4)};
  o.good=function(s){var t=top[s],c=[14,13,12].filter(function(n){return t.indexOf(n)>=0}).length,d=[14,13,12,11,10].filter(function(n){return t.indexOf(n)>=0}).length;return c>=2||d>=3};
  // Bra färg för 11 hp-öppning enligt användarens precisering: 6 kort + 3 honnörer eller 7 kort + 2 honnörer. Honnörer = A, K, Q, J; 10 räknas som mellankort.
  o.goodForEleven=function(s){var n=L[s],hon=[14,13,12,11].filter(function(r){return top[s].indexOf(r)>=0}).length;return (n===6&&hon>=3)||(n===7&&hon>=2)};
  o.longest=function(){return Math.max(L.C,L.D,L.H,L.S)};
  o.singles=function(){return SU.filter(function(s){return L[s]<=1})};
  return o;
}
/* Nod: {exp:kod|null, alt:[], why:'', means:function(kod), conv:'', soft:bool} */
function T(m){return function(c){return m[c]||null}}
function ok(c,last){return c==='P'||c==='X'||c==='XX'||(isBid(c)&&(!last||rk(c)>rk(last)))}
function NC(why,means,conv){return {exp:null,alt:[],why:why||'Situationen beskrivs inte i dokumentet.',means:means||function(){return null},conv:conv||'övrigt'}}

/* ---------- ÖPPNING ---------- */
function openingNode(h){
  var hp=h.hp,L=h.L,m=h.longest(),exp,alt=[],why;
  var cs=SU.filter(function(s){return L[s]===m}),pick;
  if(m>=5){pick=cs[cs.length-1];if(cs.length>1&&pick==='S'&&cs.indexOf('C')>=0)alt.push('1C')}
  else{var f=SU.filter(function(s){return L[s]===4});pick=f[0]}
  var one='1'+pick;
  if(hp>=12&&hp<=21&&L.H>=5&&L.C>=4){exp='2C';why=hp+' htp med minst 5 hjärter och 4 klöver: naturlig tvåfärgsöppning 2♣ enligt avsnitt D.'}
  else if(h.bal&&hp>=22&&hp<=27){exp='2C';why='Balanserad med '+hp+' hp: 2♣ (22-24 balanserad, starkare via 2♣).'}
  else if(h.bal&&hp>=20&&hp<=21){exp='2N';why='Balanserad 20-21 hp öppnas 2NT.'}
  else if(h.bal&&hp>=15&&hp<=17){exp='1N';why='Balanserad (fördelning '+h.shape+') med 15-17 hp öppnas 1NT.'}
  else if(hp>=22){exp='2C';why=hp+' hp är utgångskrav: öppna 2♣.'}
  else if(hp>=20){exp='2C';alt=[one];why=hp+' hp obalanserad är starkare än 1 i färg (12-19): 2♣, utgångskrav.'}
  else if(hp>=12){exp=one;why=hp+' hp med längsta färgen '+SYM[pick]+' ('+L[pick]+' kort): 1 i färg (12-19 hp).'}
  else if(hp===11&&h.goodForEleven(pick)){exp=one;alt=['P'];why='11 hp med bra färg: 6 kort och minst 3 honnörer eller 7 kort och minst 2 honnörer. 1 i färg är tillåtet; pass är också möjligt.'}
  else if(hp>=6&&hp<=10&&m>=6){
    if(m===6&&pick!=='C'){exp='2'+pick;why='6-10 hp och exakt 6-korts '+SYM[pick]+': svag tvåa.'}
    else if(m===6){exp='P';why='Med 6-korts ♣ finns ingen svag tvåa (2♣ är starkt). Pass.'}
    else if(m===7){exp='3'+pick;alt=['4'+pick];why='7-korts färg med 6-10 hp: spärrbud 3 i färg (ta hänsyn till zoner).'}
    else {exp='4'+pick;alt=['3'+pick];why='8-korts färg med 6-10 hp: spärrbud 4 i färg (ta hänsyn till zoner).'}
  }
  else{exp='P';why=hp+' hp räcker inte för öppning (12+, 11 med 6 kort + 3 honnörer eller 7 kort + 2 honnörer) och ingen spärrhand.'}
  return {exp:exp,alt:alt,why:why,conv:'öppning',means:function(c){
    if(c==='P')return 'Pass: under 12 hp (11 hp kräver 6 kort + 3 honnörer eller 7 kort + 2 honnörer), ingen spärrhand.';
    if(c==='1N')return '15-17 hp, balanserad (även 5-korts högfärg).';
    if(c==='2C')return (hp>=12&&hp<=21&&L.H>=5&&L.C>=4)?'12-21 htp, minst 5 hjärter och 4 klöver: tvåfärgsöppning.':'Utgångskrav, eller 22-24 hp balanserad.';
    if(c==='2N')return '20-21 hp, balanserad.';
    if(/^2[DHS]$/.test(c))return '6-10 hp, exakt 6-korts '+SYM[c[1]]+'.';
    if(/^3[CDHS]$/.test(c))return 'Spärrbud, 6-10 hp, 7-korts färg.';
    if(/^4[CDHS]$/.test(c))return 'Spärrbud, 6-10 hp, 8-korts färg.';
    if(/^1[CDHS]$/.test(c))return '12-19 hp, 4+ färg (11 hp endast med 6 kort + 3 honnörer eller 7 kort + 2 honnörer).';
    return null}};
}

/* ---------- SVAR PÅ 1 I FÄRG ---------- */
function resp1(h,oc){
  var o=st_(oc),hp=h.hp,L=h.L,M=maj(o),sup=L[o]>=4,htp=sup?h.htp(o):hp,exp,why,alt=[];
  var cand=SU.filter(function(s){return s!==o&&rk('1'+s)>rk(oc)&&L[s]>=4});
  function pickBest(cs){var b=cs[0];cs.forEach(function(s){if(L[s]>L[b])b=s});return b}
  var means=function(c){
    if(c==='P')return 'Pass: under 6 hp.';
    if(c==='1N')return '6-10 hp, förnekar 4-korts stöd och 4-korts färg som kan bjudas på 1-nivå.';
    if(c==='2N')return 'Stenberg: 13+ htp, 4+ stöd, utgångskrav.';
    if(isBid(c)&&st_(c)===o){var l=lv(c);
      if(l===2)return '6-9 htp, 4+ stöd.';
      if(l===3)return '10-12 htp, 4+ stöd.';
      if(l===4)return M?'Spärrbud, max 12 htp, bra stöd och svitad hand.':'Spärrbud, max 9 htp, bra stöd och svitad hand.'}
    if(isBid(c)&&st_(c)!=='N'&&st_(c)!==o){var lo=lowest(st_(c),oc),l2=lv(c);
      if(c===lo&&l2===1)return '1 över 1: 6+ hp, 4+ färg, rondkrav (partnern får inte passa).';
      if(c===lo&&l2===2)return '2 över 1: 11+ hp, 4+ färg, rondkrav (partnern får inte passa).';
      if(l2>lv(lo))return 'Dubbelhopp i ny färg: renons i färgen, 4+ stöd och 13+ htp.'}
    return null};
  if(M&&sup){
    if(htp<6){exp='P';why='Bara '+htp+' htp med stöd: för svag för att svara.'}
    else if(htp<=9){exp='2'+o;why=htp+' htp med 4+ stöd i högfärgen: 2 i färgen (6-9).'}
    else if(htp<=12){exp='3'+o;why=htp+' htp med 4+ stöd: 3 i färgen (10-12).'}
    else{exp='2N';why=htp+' htp med 4+ stöd: Stenberg 2NT (13+).'}
  }else if(hp<6&&(!sup||htp<6)){exp='P';why='Under 6 hp: pass.'}
  else if(!M&&sup&&cand.some(maj)){var cm=cand.filter(maj);exp=lowest(pickBest(cm),oc);why='Stöd i lågfärg men egen 4+ högfärg: visa högfärgen först (sök högfärg).';
    if(cm.length>1&&L[cm[0]]===L[cm[1]])alt.push(lowest(cm[0]===pickBest(cm)?cm[1]:cm[0],oc))}
  else if(!M&&sup){
    if(htp<=9){exp='2'+o;why=htp+' htp med 4+ stöd i lågfärgen: 2 i färgen.'}
    else if(htp<=12){exp='3'+o;why=htp+' htp med 4+ stöd: 3 i färgen.'}
    else{exp='2N';why=htp+' htp med 4+ stöd: Stenberg 2NT.'}
  }
  else if(cand.length){var b=pickBest(cand);exp=lowest(b,oc);why='6+ hp och en 4+ färg som kan bjudas på 1-nivå: 1 över 1.';
    cand.forEach(function(s){if(s!==b&&L[s]===L[b])alt.push(lowest(s,oc))})}
  else if(hp<=10){exp='1N';why=hp+' hp utan 4-korts stöd eller färg på 1-nivå: 1NT (6-10).'}
  else{var c2=SU.filter(function(s){return s!==o&&L[s]>=4});
    if(c2.length){var b2=pickBest(c2);exp=lowest(b2,oc);why=hp+' hp och 4+ färg: 2 över 1 (11+, rondkrav).'}
    else{return {exp:null,alt:[],why:hp+' hp utan färg att visa: dokumentet beskriver inte detta bud.',means:means,conv:'svar'}}}
  return {exp:exp,alt:alt,why:why,means:means,conv:htp>=13&&exp==='2N'?'Stenberg':'svar'};
}

/* ---------- 1NT / 2NT-STRUKTUR ---------- */
function ntResp(h,k){
  var hp=h.hp,L=h.L,b=2+k,Hs=maj,exp,why,alt=[],soft=false;
  var lo=k?5:8,gl=k?5:10;
  var c2=(b)+'C',d2=(b)+'D',h2=(b)+'H',s2=(b)+'S',n2=(b)+'N';
  var means=function(c){
    if(c==='P')return 'Pass: dåliga kort utan färg att visa.';

function connLabel(){return 'Rum '+room+' · '+connState}
function roomScreen(){
  app.innerHTML='<div class="hero"><h1>Budträning</h1><p class="mu">Nordisk standard. Skriv samma rumskod på båda enheterna för att spela tillsammans.</p><div class="card"><p class="status">Rumskod</p><input id="rc" maxlength="12" autocapitalize="characters" autocomplete="off" style="width:100%;font:600 28px/1.2 ui-monospace,Menlo,monospace;letter-spacing:4px;text-transform:uppercase;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)" placeholder="T.EX. K7M2QX"><div class="row" style="margin-top:12px"><button id="rg">Skapa ny kod</button><button id="rj" class="pri" style="flex:1;min-height:52px;font-size:18px">Anslut</button></div><p class="mu" style="margin-top:10px">Båda måste skriva exakt samma kod. Koden fungerar som ett privat rum och kan vara vad som helst, minst 5 tecken.</p></div></div>';
  var inp=document.getElementById('rc');
  document.getElementById('rg').onclick=function(){var c='',a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(var i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];inp.value=c};
  document.getElementById('rj').onclick=function(){var v=inp.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length<5){inp.style.borderColor='#d24a3a';return}room=v;try{localStorage.setItem('bt_room',room)}catch(e){}connect();render()};
}
function loadSaved(){try{return JSON.parse(localStorage.getItem('bt_saved')||'[]')}catch(e){return []}}
function putSaved(l){try{localStorage.setItem('bt_saved',JSON.stringify(l))}catch(e){}}
function saveDeal(){
  if(!state||!state.hands)return;
  var st=state,l=loadSaved(),p=pack(st);p.id='d'+Date.now();p.savedAt=new Date().toISOString().slice(0,10);
  l.unshift(p);putSaved(l.slice(0,40));
  savedFlag=true;render();setTimeout(function(){savedFlag=false;render()},1800);
}
function savedHtml(){
  var l=loadSaved();if(!l.length)return '';
  var h='<div class="card"><p class="status">Sparade givar (på den här enheten)</p>';
  l.forEach(function(s){
    h+='<div style="border-top:1px solid var(--line);padding:8px 0"><div class="mu">Giv '+esc(s.no)+' · '+(s.mode==='ostord'?'ostört':'störd')+' · '+esc(s.savedAt)+'</div><div class="row" style="margin-top:6px"><button data-play="'+esc(s.id)+'">Spela om</button>'+((s.h&&s.h.length)?'<button data-show="'+esc(s.id)+'">Visa budgivning</button>':'')+'<button data-del="'+esc(s.id)+'" class="mu">Ta bort</button></div></div>';
  });
  return h+'</div>';
}
function attachSaved(){
  function find(id){return loadSaved().filter(function(s){return s.id===id})[0]}
  Array.prototype.forEach.call(app.querySelectorAll('[data-play]'),function(b){b.onclick=function(){var s=find(b.getAttribute('data-play'));if(s){clr();var q=JSON.parse(JSON.stringify(s));q.h=[];q.rep=(q.rep||0)+1;save(build(q))}}});
  Array.prototype.forEach.call(app.querySelectorAll('[data-show]'),function(b){b.onclick=function(){var s=find(b.getAttribute('data-show'));if(s){clr();save(build(s))}}});
  Array.prototype.forEach.call(app.querySelectorAll('[data-del]'),function(b){b.onclick=function(){var id=b.getAttribute('data-del');putSaved(loadSaved().filter(function(s){return s.id!==id}));render()}});
}
var score={},hintText='',hintBusy=false,showHp=false,focusSel='alla';
function mySeat(st){if(seat!=='X')return seat;var t=turn(st);return (t==='N'||t==='S')?t:'N'}
function lastHumanSeat(st){for(var i=st.bids.length-1;i>=0;i--)if(!isBot(st.bids[i].s))return st.bids[i].s;return null}
function submitCall(st,me,c){
  var nb=st.bids.concat([{s:me,c:c}]);clr();
  save(advance({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,bids:nb,review:null,rep:st.rep||0}));
  
}
function canUndo(st){for(var i=st.bids.length-1;i>=0;i--){if(!isBot(st.bids[i].s))return seat==='X'||st.bids[i].s===seat}return false}
function undoBid(){
  var st=state,i;
  for(i=st.bids.length-1;i>=0;i--)if(!isBot(st.bids[i].s))break;
  if(i<0||(seat!=='X'&&st.bids[i].s!==seat))return;
  clr();save({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,bids:st.bids.slice(0,i),review:null,rep:st.rep||0});
}
function hpInfo(h){
  var L=shapeOf(h);
  return hpOf(h)+' hp · '+[L.S,L.H,L.D,L.C].sort(function(a,b){return b-a}).join('-')+(isBal(L)?' · balanserad':' · obalanserad');
}
function setSel(m,f){modeSel=m;focusSel=f;if(!state||!state.hands){state=state||{menu:true,no:0};rev++;send({v:rev,from:sender,st:pack(state)})}}
function setSeat(s){if(s===null&&seat)lastSeat=seat;seat=s;clr();try{if(s)localStorage.setItem('bt_seat',s);else localStorage.removeItem('bt_seat')}catch(e){}render()}

var pickL=null,pickS=null,pickO=null;
function clr(){pickL=null;pickS=null;pickO=null;hintText=''}
function curPick(){return pickO||(pickL&&pickS?pickL+pickS:null)}
function oppList(st){
  var l=st.bids.filter(function(b){return side(b.s)===1&&b.c!=='P'&&b.e});
  if(!l.length)return '';
  return '<p class="mu" style="margin:10px 0 2px"><b>Motståndarnas bud (robotens avsikt)</b></p>'+l.map(function(b){return '<p style="margin:2px 0">'+NAME[b.s]+' '+fmt(b.c)+' – '+esc(b.e)+'</p>'}).join('');
}
function fanHtml(cards){
  var o='';
  ['S','H','D','C'].forEach(function(s){
    cards.filter(function(c){return c[0]===s}).map(function(c){return +c.slice(1)}).sort(function(a,b){return b-a}).forEach(function(n){
      o+='<div class="cd'+(s==='H'||s==='D'?' r':'')+'" data-s="'+SYM[s]+'"><b>'+(RK[n]||n)+'</b><i>'+SYM[s]+'</i></div>';
    });
  });
  return '<div class="fan">'+o+'</div>';
}
function seatHtml(st,s,rel){
  var lc=null;st.bids.forEach(function(b){if(b.s===s)lc=b.c});
  return '<div class="seat'+(!ended(st)&&turn(st)===s?' turn':'')+'"><span class="nm">'+NAME[s]+(s===st.dealer?'<span class="dl">D</span>':'')+'</span><small>'+rel+'</small><span class="bks">'+new Array(14).join('<i class="bk"></i>')+'</span><span class="lc">'+(lc?fmt(lc):'&nbsp;')+'</span></div>';
}
function endHand(st,s){return '<div class="eh'+(side(s)===0?' us':'')+'"><b>'+NAME[s]+'</b>'+handHtml(st.hands[s])+'</div>'}
function handBlock(st,me){
  return '<div class="row"><span class="nm">'+NAME[me]+(seat==='X'?' · på tur':' · du')+'</span>'+(me===st.dealer?'<span class="dl" style="margin:0">D</span>':'')+'</div>'+fanHtml(st.hands[me])+'<div class="row"><button id="hpb" class="sm ghost">'+(showHp?'Dölj poäng':'Visa poäng')+'</button>'+(showHp?'<span class="chip" style="background:rgba(0,0,0,.28);color:#f1ecdc;border-color:rgba(255,255,255,.2)">'+hpInfo(st.hands[me])+'</span>':'')+'</div>';
}
function render(){
  if(!room){roomScreen();return}
  if(!seat){
    app.innerHTML='<div class="hero"><h1>Budträning</h1><p class="mu">Nordisk standard. Vem sitter vid den här enheten?</p><div class="modes" style="margin-top:18px"><button id="sN" class="seatpick'+(lastSeat==='N'?' on':'')+'"><b>Norr</b><span>Du spelar Norr på den här enheten.</span></button><button id="sS" class="seatpick'+(lastSeat==='S'?' on':'')+'"><b>Syd</b><span>Du spelar Syd på den här enheten.</span></button></div><div style="margin-top:14px"><button id="sX" class="seatpick'+(lastSeat==='X'?' on':'')+'" style="width:100%;min-height:90px"><b>Båda på en enhet</b><span>Du spelar både Norr och Syd på den här enheten.</span></button></div></div>';
    document.getElementById('sN').onclick=function(){setSeat('N')};
    document.getElementById('sS').onclick=function(){setSeat('S')};
    document.getElementById('sX').onclick=function(){setSeat('X')};
    return;
  }
  if(!state||!state.hands){
    app.innerHTML='<div class="hero"><h1>Budträning</h1><p class="mu">Nordisk standard</p><p class="status" style="margin-top:20px">Välj budgivning</p><div class="modes"><button id="m1" class="mode'+(modeSel==='stord'?' on':'')+'"><b>Störd budgivning</b><span>Öst och Väst lägger sig i. Träna inkliv, dubbling och spärr.</span></button><button id="m2" class="mode'+(modeSel==='ostord'?' on':'')+'"><b>Ostörd budgivning</b><span>Motståndarna passar. Träna ert eget system.</span></button></div><p class="status" style="margin-top:24px">Vad vill ni träna?</p><div class="foc">'+FOC.map(function(f){return '<button class="ft'+(f[0]===focusSel?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join('')+'</div><div style="margin-top:16px"><button id="go2" class="pri" style="width:100%;min-height:60px;font-size:20px">Starta träning</button></div>'+savedHtml()+'<div class="row" style="margin-top:14px"><button id="sw" class="sm">Byt plats</button><button id="rm" class="sm">Byt rum</button></div></div>';
    var no=(state&&state.no)||0;
    var b1=document.getElementById('m1'),b2=document.getElementById('m2');
    b1.onclick=function(){setSel('stord',focusSel);b1.classList.add('on');b2.classList.remove('on')};
    document.getElementById('go2').onclick=function(){clr();save(newDeal(no+1,modeSel,focusSel,newSeed()))};
    b2.onclick=function(){setSel('ostord',focusSel);b2.classList.add('on');b1.classList.remove('on')};
    document.getElementById('sw').onclick=function(){setSeat(null)};
    document.getElementById('rm').onclick=function(){room='';try{localStorage.removeItem('bt_room')}catch(e){}if(es)es.close();connState='offline';render()};
    Array.prototype.forEach.call(app.querySelectorAll('[data-f]'),function(b){b.onclick=function(){setSel(modeSel,b.getAttribute('data-f'));Array.prototype.forEach.call(app.querySelectorAll('[data-f]'),function(c){c.classList.toggle('on',c===b)})}});
    attachSaved();
    return;
  }
  var st=state,me=mySeat(st),end=ended(st),t=turn(st),mine=!end&&t===me;
  var base='S',pos={l:'W',t:'N',r:'E'},x=ctx(st);
  function rel(s){return s===partner(me)?'Partner':'Motstånd'}
  var h='<header class="bar"><div class="brand"><b>♠</b>Budträning</div><div class="row"><span class="chip hi">Giv '+st.no+(st.rep?' · omspel':'')+'</span><span class="chip">'+(st.mode==='ostord'?'Ostörd':'Störd')+'</span>'+(st.focus&&st.focus!=='alla'?'<span class="chip">'+focLabel(st.focus)+'</span>':'')+'<span class="chip">'+(seat==='X'?'En enhet':'Du är '+NAME[me])+'</span><span class="chip">'+connLabel()+'</span></div><div class="row"><button id="sv" class="sm">'+(savedFlag?'Sparad ✓':'Spara given')+'</button><button id="md" class="sm">Byt tema</button><button id="sw" class="sm">Byt plats</button><button id="cpb" class="sm">Spelkod</button><button id="fsb" class="sm">Helskärm</button></div></header><main class="main">';
  var hbx=x.lb?'<div class="hb">'+fmt(x.lb)+(x.dbl===1?' <small>X</small>':x.dbl===2?' <small>XX</small>':'')+'</div><div class="hl">'+(end?'Slutkontrakt · ':'Högsta bud · ')+NAME[x.lbS]+'</div>':'<div class="hl">'+(end?'Alla passade':'Ingen har bjudit än')+'</div>';
  if(end){
    h+='<section class="table end"><div class="seatT">'+endHand(st,pos.t)+'</div><div class="seatL">'+endHand(st,pos.l)+'</div><div class="center">'+hbx+'</div><div class="seatR">'+endHand(st,pos.r)+'</div><div class="mine">'+endHand(st,base)+'</div></section>';
  }else{
    h+='<section class="table"><div class="seatT">'+(pos.t===me?handBlock(st,me):seatHtml(st,pos.t,rel(pos.t)))+'</div><div class="seatL">'+seatHtml(st,pos.l,rel(pos.l))+'</div><div class="center">'+hbx+'</div><div class="seatR">'+seatHtml(st,pos.r,rel(pos.r))+'</div><div class="mine">'+(base===me?handBlock(st,me):seatHtml(st,base,rel(base)))+'</div></section>';
  }
  h+='<aside class="side"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="status" style="margin:0">Budgivning</p>'+(canUndo(st)?'<button id="undo" class="sm">Ångra mitt senaste bud</button>':'')+'</div><div class="ascroll">'+auctionHtml(st,end)+'</div></div>';
  if(end){
    h+='<div class="card"><p class="status">'+contractText(st)+'</p>'+oppList(st)+'<div class="row" style="margin-top:12px"><button id="rp">Spela om given</button><button id="nd" class="pri">Ny giv</button></div></div>'+reviewHtml(st);
  }else if(mine){
    h+='<div class="card"><p class="status">'+(seat==='X'?NAME[me]+' bjuder':'Din tur att bjuda')+'</p><div class="lv">';
    for(var l=1;l<=7;l++){var okL=SU.some(function(s){return legal(st,l+s,me)});h+='<button data-l="'+l+'" '+(okL?'':'disabled ')+(pickL===l?'class="on"':'')+'>'+l+'</button>'}
    h+='</div><div class="st">';
    SU.forEach(function(s){var okS=pickL?legal(st,pickL+s,me):true;h+='<button data-s="'+s+'" '+(okS?'':'disabled ')+(pickS===s?'class="on"':'')+'><span class="'+(s==='H'||s==='D'?'red':'')+(s==='N'?' nt':'')+'">'+SYM[s]+'</span></button>'});
    h+='</div><div class="ops"><button data-o="P">Pass</button><button data-o="X" '+(legal(st,'X',me)?'':'disabled')+'>X</button><button data-o="XX" '+(legal(st,'XX',me)?'':'disabled')+'>XX</button></div></div>';
  }else{
    h+='<div class="card wait"><p class="status">Väntar på '+NAME[t]+'</p><p class="mu">Budet visas här så fort det är lagt.</p></div>';
  }
  h+='</aside></main>';
  app.innerHTML=h;
  document.getElementById('sw').onclick=function(){setSeat(null)};
  var cb=document.getElementById('cpb');if(cb)cb.onclick=function(){var c=makeCode();try{navigator.clipboard.writeText(c)}catch(e){}var q=prompt('Din spelkod är kopierad. Klistra in partnerns kod här för att synka manuellt (lämna tomt för att avbryta):','');if(q&&!applyCode(q))alert('Koden gick inte att läsa.')};
  var xb=document.getElementById('xp');if(xb)xb.onclick=function(){copyText(reviewPrompt(st))};
  var fb=document.getElementById('fsb');if(fb)fb.onclick=function(){try{var d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}}catch(e){}};
  document.getElementById('md').onclick=function(){clr();setSel(st.mode||'stord',st.focus||'alla');save({menu:true,no:st.no})};
  document.getElementById('sv').onclick=saveDeal;
  var hb=document.getElementById('hpb');if(hb)hb.onclick=function(){showHp=!showHp;try{localStorage.setItem('bt_hp',showHp?'1':'0')}catch(e){}render()};
  var un=document.getElementById('undo');if(un)un.onclick=undoBid;
  var nd=document.getElementById('nd');if(nd)nd.onclick=function(){clr();save(newDeal(st.no+1,st.mode,st.focus,newSeed()))};
  var rp=document.getElementById('rp');if(rp)rp.onclick=function(){clr();save(replay(st))};
  Array.prototype.forEach.call(app.querySelectorAll('[data-l]'),function(b){
    b.onclick=function(){pickL=+b.getAttribute('data-l');pickO=null;if(pickS&&!legal(st,pickL+pickS,me))pickS=null;if(pickS){submitCall(st,me,pickL+pickS);return}render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-s]'),function(b){
    b.onclick=function(){pickS=b.getAttribute('data-s');pickO=null;if(pickL&&!legal(st,pickL+pickS,me))pickL=null;if(pickL){submitCall(st,me,pickL+pickS);return}render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-o]'),function(b){
    b.onclick=function(){var o=b.getAttribute('data-o');if(legal(st,o,me)){submitCall(st,me,o);return}pickO=o;pickL=null;pickS=null;render()};
  });
  var go=document.getElementById('go');
  if(go)go.onclick=function(){
    var c=curPick();if(!c||!legal(st,c,me))return;
    var nb=st.bids.concat([{s:me,c:c}]);clr();
    save(advance({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,bids:nb,review:null,rep:st.rep||0}));
    
  };
}

if(room)connect();
render();
})();
</script>
</body>
</html>
