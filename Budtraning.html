window.BudThemeDiagnostics=function(samples){
  samples=Math.max(1,Math.min(200,+samples||25));
  var report=[],failures=[];
  FOC.forEach(function(item){
    var focus=item[0],modes=(focus==='dubbling'||focus==='inkliv')?['stord']:['stord','ostord'];

        try{
          var seed=(7919*(i+1)+focus.length*104729+(mode==='ostord'?17:0))>>>0;
          var deal=newDeal(i+1,mode,focus,seed);
          if(!focusOk(deal.hands,focus))throw new Error('Giv uppfyller inte temavillkoret');
          if(mode==='ostord'&&!oppMustPass(deal.hands))throw new Error('Motståndarna kan bjuda i ostört läge');
          if(focus==='rkc'&&!naturalFitOpener(deal.hands,9))throw new Error('Saknar naturlig öppning och 9-korts stödsekvens');
          if(focus==='slam'&&!naturalFitOpener(deal.hands,8))throw new Error('Saknar naturlig öppning och 8-korts stödsekvens');
          if(focus==='slamnt'&&(hpOf(deal.hands.N)+hpOf(deal.hands.S)<=32||!slamNtOpener(deal.hands)))throw new Error('Sangslamgiv saknar 33 hp eller naturlig sangöppnare');
          ok++;

      }

      report.push(row);if(error)failures.push(row);
    });
  });
  var slamNtStats={antal:0,over32:0,med8Fit:0};
  for(var k=0;k<100;k++){
    try{var sd=newDeal(k+1,'stord','slamnt',(104729*(k+1)+7919)>>>0),sh=sd.hands;
      slamNtStats.antal++;if(hpOf(sh.N)+hpOf(sh.S)>32)slamNtStats.over32++;
      if(['S','H','D','C'].some(function(su){return shapeOf(sh.N)[su]+shapeOf(sh.S)[su]>=8}))slamNtStats.med8Fit++;
    }catch(e){failures.push({tema:'slamnt-statistik',lage:'stord',resultat:'FEL',fel:String(e&&e.message||e)});break;}
  }
  slamNtStats.over32Andel=slamNtStats.antal?slamNtStats.over32/slamNtStats.antal:0;
  slamNtStats.fitAndel=slamNtStats.antal?slamNtStats.med8Fit/slamNtStats.antal:0;
  if(slamNtStats.over32Andel<.75||slamNtStats.fitAndel<.35||slamNtStats.fitAndel>.65)failures.push({tema:'slamnt-statistik',lage:'100 givars stickprov',resultat:'FEL',fel:'Fördelningen ligger utanför målen'});
  return {ok:failures.length===0,antalTester:report.length,antalGivar:report.reduce(function(n,x){return n+x.provade},0),sangslam:slamNtStats,resultat:report,fel:failures};
};

  }

function runSupplementaryReview(st){

    }

    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
  };
}
function attachSaved(){
  function find(id){return loadSaved().filter(function(s){return s.id===id})[0]}
  Array.prototype.forEach.call(app.querySelectorAll('[data-play]'),function(b){b.onclick=function(){var s=find(b.getAttribute('data-play'));if(s){clr();var q=JSON.parse(JSON.stringify(s));q.h=[];q.rep=(q.rep||0)+1;save(build(q))}}});
  Array.prototype.forEach.call(app.querySelectorAll('[data-show]'),function(b){b.onclick=function(){var s=find(b.getAttribute('data-show'));if(s){clr();save(build(s))}}});
  Array.prototype.forEach.call(app.querySelectorAll('[data-del]'),function(b){b.onclick=function(){var id=b.getAttribute('data-del');putSaved(loadSaved().filter(function(s){return s.id!==id}));render()}});
}
var score={},hintText='',hintBusy=false,showHp=false,focusSel='alla';
function mySeat(st){if(seat!=='X')return seat;var t=turn(st);return (t==='N'||t==='S')?t:'N'}
function lastHumanSeat(st){for(var i=st.bids.length-1;i>=0;i--)if(!isBot(st.bids[i].s,st))return st.bids[i].s;return null}
function submitCall(st,me,c){
  var nb=st.bids.concat([{s:me,c:c}]);clr();
  save({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,humanSeats:st.humanSeats||['N','S'],bids:nb,review:null,rep:st.rep||0});
  
}
function canUndo(st){for(var i=st.bids.length-1;i>=0;i--){if(!isBot(st.bids[i].s,st))return !!roomConfig.count||seat==='X'||st.bids[i].s===seat}return false}
function undoBid(){
  if(roomConfig.count){requestRoomAction('undo');return}
  var st=state,i;
  for(i=st.bids.length-1;i>=0;i--)if(!isBot(st.bids[i].s,st))break;
  if(i<0||(seat!=='X'&&st.bids[i].s!==seat))return;
  clr();save({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,humanSeats:st.humanSeats||['N','S'],bids:st.bids.slice(0,i),review:null,rep:st.rep||0});
}
function hpInfo(h){
  var L=shapeOf(h);
  return hpOf(h)+' hp · '+[L.S,L.H,L.D,L.C].join('-');
}
function setSel(m,f){modeSel=m;focusSel=f;if(roomConfig.count){requestRoomAction('theme',{mode:m,focus:f});return}if(!state||!state.hands){state=state||{menu:true,no:0};rev++;send({v:rev,from:sender,st:pack(state)})}}
function setSeat(s){if(roomConfig.count){if(s===null){if(state&&state.hands&&!ended(state)){alert('Du kan byta plats när given är färdig.');return}releaseRoomSeat();return}claimRoomSeat(s);return}if(s===null&&seat)lastSeat=seat;seat=s;clr();try{if(s)localStorage.setItem('bt_seat',s);else localStorage.removeItem('bt_seat')}catch(e){}render()}

var pickL=null,pickS=null,pickO=null;
function clr(){pickL=null;pickS=null;pickO=null;hintText=''}
function curPick(){return pickO||(pickL&&pickS?pickL+pickS:null)}
function oppList(st){
  var l=st.bids.filter(function(b){return isBot(b.s,st)&&b.c!=='P'&&b.e});
  if(!l.length)return '';
  return '<p class="mu" style="margin:8px 0 0"><b>Robotar:</b> '+l.map(function(b){var parts=(b.e||'').split(' · '),why=(parts.length>2?parts.slice(2):parts.slice(1)).join(' · ').trim();if(why.length>95)why=why.slice(0,92)+'…';return NAME[b.s]+' '+fmt(b.c)+(why?' – '+esc(why):'')}).join(' · ')+'</p>';
}
function fanHtml(cards){
  var o='';
  ['S','H','D','C'].forEach(function(s){
    cards.filter(function(c){return c[0]===s}).map(function(c){return +c.slice(1)}).sort(function(a,b){return b-a}).forEach(function(n){
      o+='<div class="cd'+(s==='H'||s==='D'?' r':'')+'" data-s="'+SYM[s]+'"><b>'+(RK[n]||n)+'</b><i>'+SYM[s]+'</i></div>';
    });
  });
  return '<div class="fan">'+o+'</div>';
}
function seatHtml(st,s,rel){
   var lc=null,last=-1;st.bids.forEach(function(b,i){if(b.s===s){lc=b.c;last=i}});
   var latest=last===st.bids.length-1,pass=lc==='P',nm=roomConfig.count?seatOwnerName(s):NAME[s];
   return '<div class="seat'+(!ended(st)&&turn(st)===s?' turn':'')+'"><span class="nm">'+esc(nm)+' ('+NAME[s]+')'+(s===st.dealer?'<span class="dl">D</span>':'')+'</span>'+(rel?'<small>'+rel+'</small>':'')+'<span class="bks">'+new Array(14).join('<i class="bk"></i>')+'</span><span class="lc'+(latest?' latest':'')+(pass?' pass':'')+'">'+(lc!==null?fmt(lc):'&nbsp;')+'</span></div>';
 }

function handBlock(st,me){
  var lc=null,last=-1;
  st.bids.forEach(function(b,i){if(b.s===me){lc=b.c;last=i}});
  var latest=last===st.bids.length-1,pass=lc==='P';
  return '<div class="row"><span class="nm">'+(roomConfig.count?esc(seatOwnerName(me))+' ('+NAME[me]+')':(playerName?esc(playerName)+' ('+NAME[me]+')':NAME[me]))+(seat==='X'?(turn(st)===me?' · på tur':''):' · du')+'</span>'+(me===st.dealer?'<span class="dl" style="margin:0">D</span>':'')+'<span class="lc'+(latest?' latest':'')+(pass?' pass':'')+'">'+(lc!==null?fmt(lc):'&nbsp;')+'</span></div>'+fanHtml(st.hands[me])+'<div class="row"><button id="hpb" class="sm ghost">'+(showHp?'Dölj poäng':'Visa poäng')+'</button>'+(showHp?'<span class="chip" style="background:rgba(0,0,0,.28);color:#f1ecdc;border-color:rgba(255,255,255,.2)">'+hpInfo(st.hands[me])+'</span>':'')+'</div>';
}
function render(){
  if(!room){roomScreen();return}
  if(!roomConfig.count||!state||!state.hands||!seat){roomLobby();return}
  if(!seat){
    app.innerHTML='<div class="hero"><h1>Budträning</h1><p class="mu">Nordisk standard. Välj vilken plats du vill spela från den här enheten.</p><div class="modes" style="margin-top:18px"><button id="sN" class="seatpick'+(lastSeat==='N'?' on':'')+'"><b>Nord</b><span>Du spelar Nord.</span></button><button id="sE" class="seatpick'+(lastSeat==='E'?' on':'')+'"><b>Öst</b><span>Du spelar Öst.</span></button><button id="sS" class="seatpick'+(lastSeat==='S'?' on':'')+'"><b>Syd</b><span>Du spelar Syd.</span></button><button id="sW" class="seatpick'+(lastSeat==='W'?' on':'')+'"><b>Väst</b><span>Du spelar Väst.</span></button></div><div style="margin-top:14px"><button id="sX" class="seatpick'+(lastSeat==='X'?' on':'')+'" style="width:100%;min-height:90px"><b>Både Nord och Syd</b><span>Du spelar båda platserna på samma enhet.</span></button></div></div>';
    ['N','E','S','W'].forEach(function(s){document.getElementById('s'+s).onclick=function(){setSeat(s)}});
    document.getElementById('sX').onclick=function(){setSeat('X')};
    return;
  }
  if(!state||!state.hands){
    app.innerHTML='<div class="hero start"><h1>Budträning</h1><p class="mu">Nordisk standard</p><p class="status" style="margin-top:14px">Välj budgivning</p><div class="modes mode-grid"><button id="m1" class="mode'+(modeSel==='stord'?' on':'')+'"><b>Alla bjuder</b><span>Motståndarna kan kliva in, dubbla och spärra.</span></button><button id="m2" class="mode'+(modeSel==='ostord'?' on':'')+'"><b>Ostörd budgivning</b><span>Motståndarna passar. Träna ert eget system.</span></button></div><p class="status" style="margin-top:16px">Spelform</p><div class="modes"><button id="pm1" class="mode'+(playerMode==='solo'?' on':'')+'"><b>Ensam mot tre robotar</b><span>Du spelar vald plats (Nord eller Syd). De tre andra platserna sköts av robotar.</span></button><button id="pm2" class="mode'+(playerMode==='partner'?' on':'')+'"><b>Två människor</b><span>Nord och Syd är mänskliga. Öst och Väst är robotar.</span></button></div><div style="margin-top:12px"><button id="go2" class="pri start-button">Starta träning</button></div><p class="status" style="margin-top:16px">Vad vill ni träna?</p><div class="foc">'+FOC.map(function(f){return '<button class="ft'+(f[0]===focusSel?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join('')+'</div>'+savedHtml()+reportToolsHtml()+'<div class="row" style="margin-top:14px"><button id="sw" class="sm">Byt plats</button><button id="rm" class="sm">Byt rum</button></div></div>';
    var no=(state&&state.no)||0;
    var b1=document.getElementById('m1'),b2=document.getElementById('m2');
    b1.onclick=function(){setSel('stord',focusSel);b1.classList.add('on');b2.classList.remove('on')};
    document.getElementById('pm1').onclick=function(){setPlayerMode('solo')};
    document.getElementById('pm2').onclick=function(){setPlayerMode('partner')};
    document.getElementById('go2').onclick=function(){clr();save(newDeal(no+1,modeSel,focusSel,newSeed(),humanSeatsForNewDeal()))};
    b2.onclick=function(){setSel('ostord',focusSel);b2.classList.add('on');b1.classList.remove('on')};
    document.getElementById('sw').onclick=function(){setSeat(null)};
    document.getElementById('rm').onclick=function(){room='';try{localStorage.removeItem('bt_room')}catch(e){}if(es)es.close();connState='offline';render()};
    Array.prototype.forEach.call(app.querySelectorAll('[data-f]'),function(b){b.onclick=function(){setSel(modeSel,b.getAttribute('data-f'));Array.prototype.forEach.call(app.querySelectorAll('[data-f]'),function(c){c.classList.toggle('on',c===b)})}});
    attachSaved();attachReportTools();
    return;
  }
  var st=state,me=mySeat(st),end=ended(st),t=turn(st),mine=!end&&t===me;
  var pos={l:'W',t:'N',r:'E'},x=ctx(st);
  function seatView(s){return (s===me||(seat==='X'&&(s==='N'||s==='S')))?handBlock(st,s):seatHtml(st,s,rel(s))}
  function rel(s){return s===partner(me)?'Partner':''}
  var h='<header class="bar"><div class="brand"><b>♠</b>Budträning</div><div class="row"><span class="chip hi">Giv '+st.no+(st.rep?' · omspel':'')+'</span><span class="chip">'+(st.mode==='ostord'?'Ostörd':'Alla bjuder')+'</span>'+(st.focus&&st.focus!=='alla'?'<span class="chip">'+focLabel(st.focus)+'</span>':'')+'<span class="chip">'+(roomConfig.count?(seat==='X'?esc(seatOwnerName('N'))+' (Nord och Syd)':esc(seatOwnerName(me))+' ('+NAME[me]+')'):(seat==='X'?(playerName?esc(playerName)+' · N/S':'En enhet'):(playerName?esc(playerName)+' ('+NAME[me]+')':'Du är '+NAME[me])))+'</span><span class="chip">'+connLabel()+'</span></div><div class="row"><button id="sv" class="sm">'+'Rapportera giv'+'</button><button id="md" class="sm">Byt tema</button><button id="sw" class="sm">Byt plats</button><button id="cpb" class="sm">Spelkod</button><button id="fsb" class="sm">Helskärm</button></div></header><main class="main">';
  var hbx=x.lb?'<div class="hb">'+fmt(x.lb)+(x.dbl===1?' <small>X</small>':x.dbl===2?' <small>XX</small>':'')+'</div><div class="hl">'+(end?'Slutkontrakt · ':'Högsta bud · ')+NAME[x.lbS]+'</div>':'<div class="hl">'+(end?'Alla passade':'Ingen har bjudit än')+'</div>';
  h+='<div class="board-column">';
  if(end){
    function seatHand(seat,label){var p=handPoints(st.hands[seat]),display=roomConfig.count?seatOwnerName(seat)+' ('+label+')':label;return '<div class="hand-seat '+({N:'north',S:'south',E:'east',W:'west'}[seat])+'"><b>'+esc(display)+' ('+p.hp+' hp)</b>'+handHtml(st.hands[seat])+'</div>'}
    h+='<section class="table end">'+seatHand('N','Norr')+seatHand('W','Väst')+'<div class="center">'+hbx+'</div>'+seatHand('E','Öst')+seatHand('S','Syd')+'</section>';
    h+='<div id="dds-review" class="card dds-panel"><p class="status">Teoretiskt optimalt kontrakt</p><p class="mu">Väntar på DDS…</p></div>';
  }else{
    h+='<section class="table"><div class="seatT">'+seatView('N')+'</div><div class="seatL">'+seatView('W')+'</div><div class="center">'+hbx+'</div><div class="seatR">'+seatView('E')+'</div><div class="mine">'+seatView('S')+'</div></section>';
  }
  h+='</div><aside class="side"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="status" style="margin:0">Budgivning</p>'+(canUndo(st)?'<button id="undo" class="sm">Ångra mitt senaste bud</button>':'')+'</div><div class="ascroll">'+auctionHtml(st,end)+'</div></div>';
  if(end){
    h+='<div class="card"><p class="status">'+contractText(st)+'</p>'+oppList(st)+'<div class="row" style="margin-top:12px"><button id="rp" '+(roomConfig.count&&!roomReady()?'disabled':'')+'>Spela om given</button><button id="nd" class="pri" '+(roomConfig.count&&!roomReady()?'disabled':'')+'>Ny giv</button></div>'+(roomConfig.count&&!roomReady()?'<p class="mu">Väntar på spelare innan nästa giv.</p>':'')+'</div>'+reviewHtml(st);
  }else if(mine){
    h+='<div class="card"><p class="status">'+(seat==='X'?NAME[me]+' bjuder':'Din tur att bjuda')+'</p><div class="lv">';
    for(var l=1;l<=7;l++){var okL=SU.some(function(s){return legal(st,l+s,me)});h+='<button data-l="'+l+'" '+(okL?'':'disabled ')+(pickL===l?'class="on"':'')+'>'+l+'</button>'}
    h+='</div><div class="st">';
    SU.forEach(function(s){var okS=pickL?legal(st,pickL+s,me):true;h+='<button data-s="'+s+'" '+(okS?'':'disabled ')+(pickS===s?'class="on"':'')+'><span class="'+(s==='H'||s==='D'?'red':'')+(s==='N'?' nt':'')+'">'+SYM[s]+'</span></button>'});
    h+='</div><div class="ops"><button data-o="P">Pass</button><button data-o="X" '+(legal(st,'X',me)?'':'disabled')+'>X</button><button data-o="XX" '+(legal(st,'XX',me)?'':'disabled')+'>XX</button></div></div>';
  }else{
    h+='<div class="card wait"><p class="status">Väntar på '+NAME[t]+'</p><p class="mu">Budet visas här så fort det är lagt.</p></div>';
  }
  h+='</aside></main>';
  app.innerHTML=h;
  if(end&&window.runDdsReview)window.runDdsReview(st);
  if(end&&window.BudAnalys&&window.BudAnalys.loadSupplementary)runSupplementaryReview(st);
  document.getElementById('sw').onclick=function(){setSeat(null)};
  var cb=document.getElementById('cpb');if(cb)cb.onclick=function(){var c=makeCode();try{navigator.clipboard.writeText(c)}catch(e){}var q=prompt('Din spelkod är kopierad. Klistra in partnerns kod här för att synka manuellt (lämna tomt för att avbryta):','');if(q&&!applyCode(q))alert('Koden gick inte att läsa.')};
  var fb=document.getElementById('fsb');if(fb)fb.onclick=function(){try{var d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}}catch(e){}};
  document.getElementById('md').onclick=function(){if(roomConfig.count){requestRoomAction('menu');return}clr();setSel(st.mode||'stord',st.focus||'alla');save({menu:true,no:st.no})};
  document.getElementById('sv').onclick=saveDeal;
  var hb=document.getElementById('hpb');if(hb)hb.onclick=function(){showHp=!showHp;try{localStorage.setItem('bt_hp',showHp?'1':'0')}catch(e){}render()};
  var un=document.getElementById('undo');if(un)un.onclick=undoBid;
  var nd=document.getElementById('nd');if(nd)nd.onclick=function(){clr();if(roomConfig.count)requestRoomAction('next');else save(newDeal(st.no+1,st.mode,st.focus,newSeed(),st.humanSeats||['N','S']))};
  var rp=document.getElementById('rp');if(rp)rp.onclick=function(){clr();if(roomConfig.count)requestRoomAction('replay');else save(replay(st))};
  Array.prototype.forEach.call(app.querySelectorAll('[data-l]'),function(b){
    b.onclick=function(){pickL=+b.getAttribute('data-l');pickO=null;if(pickS&&!legal(st,pickL+pickS,me))pickS=null;if(pickS){submitCall(st,me,pickL+pickS);return}render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-s]'),function(b){
    b.onclick=function(){pickS=b.getAttribute('data-s');pickO=null;if(pickL&&!legal(st,pickL+pickS,me))pickL=null;if(pickL){submitCall(st,me,pickL+pickS);return}render()};
  });
  Array.prototype.forEach.call(app.querySelectorAll('[data-o]'),function(b){
    b.onclick=function(){var o=b.getAttribute('data-o');if(legal(st,o,me)){submitCall(st,me,o);return}pickO=o;pickL=null;pickS=null;render()};
  });
  var go=document.getElementById('go');
  if(go)go.onclick=function(){
    var c=curPick();if(!c||!legal(st,c,me))return;
    var nb=st.bids.concat([{s:me,c:c}]);clr();
    save({id:st.id,seed:st.seed,no:st.no,mode:st.mode,focus:st.focus,hands:st.hands,dealer:st.dealer,humanSeats:st.humanSeats||['N','S'],bids:nb,review:null,rep:st.rep||0});
    
  };
}

if(room){try{var oldSeat=localStorage.getItem('bt_seat');if(oldSeat)seat=oldSeat}catch(e){}connect()}
render();
})();
</script>
