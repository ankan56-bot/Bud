name: Theme deal regression

on:
  push:
    branches:
      - work/theme-dataset-analysis
  pull_request:
    branches:
      - main

jobs:
  theme-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate deterministic dataset
        run: node testdata/generate-theme-deals.js
      - name: Ensure generated data is unchanged
        run: git diff --exit-code -- testdata/theme_deals_140.json
      - name: Run dataset and reproducibility tests
        run: node --test testdata/theme-deals.test.js
      - name: Run auction dispatch regression tests
        run: node --test testdata/auction-dispatch.test.js
      - name: Run analysis library matching tests
        run: node --test testdata/analysis-library-match.test.js
      - name: Run structured hand condition tests
        run: node --test testdata/hand-conditions.test.js
      - name: Run AI seat isolation tests
        run: node --test testdata/seat-view.test.js
      - name: Run player role tests
        run: node --test testdata/player-roles.test.js
