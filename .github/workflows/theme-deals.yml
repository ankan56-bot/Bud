name: Theme deal regression

on:
  push:
    branches:
      - work/theme-dataset-analysis
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: theme-deals-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  theme-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate deterministic dataset
        run: node testdata/generate-theme-deals.js
      - name: Verify deterministic generation
        run: |
          cp testdata/theme_deals_140.json /tmp/theme_deals_140.first.json
          node testdata/generate-theme-deals.js
          cmp /tmp/theme_deals_140.first.json testdata/theme_deals_140.json
      - name: Run dataset and reproducibility tests
        run: node --test testdata/theme-deals.test.js
      - name: Run auction dispatch regression tests
        run: node --test testdata/auction-dispatch.test.js
      - name: Run documented overcall response tests
        run: node --test testdata/overcall-responses.test.js
      - name: Guard unresolved system gaps
        run: node --test testdata/unresolved-system-gaps.test.js
      - name: Run analysis library matching tests
        run: node --test testdata/analysis-library-match.test.js
      - name: Run structured hand condition tests
        run: node --test testdata/hand-conditions.test.js
      - name: Run structured hand profile tests
        run: node --test testdata/hand-profile-conditions.test.js
      - name: Run AI seat isolation tests
        run: node --test testdata/seat-view.test.js
      - name: Run player role tests
        run: node --test testdata/player-roles.test.js
      - name: Run RKC final-pass regression tests
        run: node --test testdata/rkc-final-pass.test.js
      - name: Validate DDS WebAssembly assets and browser wiring
        run: node --test testdata/dds-runtime.test.js
      - name: Upload regenerated theme dataset
        uses: actions/upload-artifact@v4
        with:
          name: theme-deals-${{ github.sha }}
          path: testdata/theme_deals_140.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit regenerated dataset baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testdata/theme_deals_140.json
          if ! git diff --cached --quiet; then
            RULES_VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync('rattningsmotor.js','utf8');process.stdout.write((s.match(/version:'([^']+)'/)||[])[1]||'unknown')")
            git commit -m "Update theme deal baseline for correction engine ${RULES_VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
