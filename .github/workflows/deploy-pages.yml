name: Deploy playable bridge trainer

on:
  push:
    branches: [work/undisturbed-architecture]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested trainer
        uses: actions/checkout@v4
        with:
          ref: work/undisturbed-architecture

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build minimal playable site
        run: node scripts/stage-pages.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
