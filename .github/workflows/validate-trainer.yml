name: Validate bridge trainer
on:
  push:
    branches: [feature/two-player-dds, work/hps-reverse-audit, feature/one-major-to-game-4nt, work/undisturbed-architecture]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check rattningsmotor.js
          node --check stenberg.js
          node --check trumfstod.js
          node --check sangbudgivning.js
          node --check slamlogik.js
          node --check dds-integration.js
          node --check analysmotor.js
          node --check facitmotor.js
          node --check ej-tackta-logg.js
      - name: Validate analysis library JSON
        run: |
          node - <<'NODE'
          const x = require('./analysbibliotek.json');
          if (!Array.isArray(x.trees) || !x.trees.length) throw new Error('Analysis library is empty');
          console.log(x.version + ': ' + x.trees.length + ' trees');
          NODE
      - name: Check inline application scripts
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("Budtraning.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          for i, script in enumerate(scripts):
              pathlib.Path(f"/tmp/inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(scripts)} inline script(s)")
          PY
          for file in /tmp/inline-*.js; do node --check "$file"; done
      - name: Smoke test correction engine exports
        run: |
          node - <<'NODE'
          const R = require('./rattningsmotor.js');
          if (typeof R.judge !== 'function' || typeof R.nodeFor !== 'function' || typeof R.validateAuction !== 'function' || typeof R.decideLive !== 'function') {
            throw new Error('Correction engine exports are incomplete');
          }
          const hand = ['S14','S13','S12','S11','S10','H14','H13','H12','H11','D14','D13','C14','C13'];
          const result = R.nodeFor({hands:{N:hand},dealer:'N',bids:[{s:'N',c:'P'}]},0);
          if (!result || !result.exp) throw new Error('Opening decision-tree smoke test failed');
          console.log('Correction engine v' + R.version + ': opening recommendation ' + result.exp);
          NODE
      - name: Run Stenberg 2NT regression tests
        run: node tests/stenberg-2nt.test.js
      - name: Run trump-support module tests
        run: node tests/trumfstod.test.js
      - name: Audit undisturbed analysis-library structure
        run: |
          node scripts/validate-analysis-library.js
          node tests/analysis-library-audit.test.js
      - name: Run undisturbed facit generator tests
        run: node tests/facitmotor.test.js
      - name: Test uncovered bidding log and deduplication
        run: node tests/ej-tackta-logg.test.js
      - name: Characterize known live hidden-hand dependency
        run: node tests/known-live-hidden-hand-leak.test.js
      - name: Test analysis-node collision diagnostics
        run: node tests/analysis-matcher-collisions.test.js
      - name: Validate supplementary bidding logic
        run: |
          node - <<'NODE'
          const x = require('./kompletterande_budlogik.json');
          if (x.authority !== 'supplementary_only' || !Array.isArray(x.entries)) throw new Error('Supplementary logic schema is invalid');
          if (x.entries.some(e => e.approvalStatus !== 'unreviewed' || e.relationshipToSystem !== 'must_not_override')) throw new Error('A supplementary candidate is incorrectly marked as approved or authoritative');
          console.log(x.version + ': ' + x.entries.length + ' unapproved candidates');
          NODE
      - name: Run supplementary matcher tests
        run: node tests/supplementary-logic.test.js
      - name: Run major-suit RKC tests
        run: node tests/rkc-nordisk-standard-major.test.js
      - name: Run all-trumps RKC and no-trump four-ace tests
        run: node tests/slam-all-trumps.test.js
      - name: Run 1NT four-ace and RKC source tests
        run: |
          node tests/nt-four-ace-source.test.js
          node tests/nt-stayman-rkc-spade-fit.test.js
      - name: Test 1NT and 4NT module boundary
        run: node tests/nt-4nt-module-boundary.test.js
      - name: Run 1NT opening boundary tests
        run: node tests/nt-opening-boundaries.test.js
      - name: Run 2NT opening response-family tests
        run: node tests/nt-two-level-opening.test.js
      - name: Run 1NT Stayman continuation tests
        run: node tests/nt-stayman-continuations.test.js
      - name: Run 1NT minor invitation and weak-minor relay tests
        run: node tests/nt-minor-invit-relay.test.js
      - name: Run 1NT transfer source-boundary tests
        run: node tests/nt-transfer-source-boundaries.test.js
      - name: Run information-safe live 1NT tests
        run: node tests/live-1nt-information-boundary.test.js
      - name: Validate Stayman analysis tree
        run: node tests/nt-stayman-analysis-tree.test.js
      - name: Run 100-deal 1♥/1♠ validation
        run: node tests/one-major-100.test.js
      - name: Run broad undisturbed regression corpus
        run: |
          node tests/ostord-100.test.js
          node tests/ostord-100-second.test.js
          node tests/ostord-400.test.js
          node tests/ostord-coverage.test.js
          node tests/ostord-manual-rules.test.js
      - name: Run 1♥/1♠ invit acceptance tests
        run: node tests/one-major-invit.test.js
      - name: Check application wiring
        run: |
          grep -q 'Rattning.nodeFor' Budtraning.html
          grep -q "if(st.mode==='ostord')" Budtraning.html
          grep -q 'dds-integration.js' Budtraning.html
          grep -q 'analysmotor.js' Budtraning.html
          grep -q 'rattningsmotor.js' Budtraning.html

      - name: Smoke test offline analysis engine
        run: |
          node - <<'NODE'
          const A = require('./analysmotor.js');
          const lib = require('./analysbibliotek.json');
          if (A.version !== '1.2.0') throw new Error('Unexpected analysis engine version');
          const heartRkc = lib.trees.find(t => t.id === 'T01_RKC_HJARTER');
          const spadeRkc = lib.trees.find(t => t.id === 'T44_RKC_NORDISK_SPADER_STENBERG');
          const minorStenberg = lib.trees.find(t => t.id === 'T35_STENBERG_2NT_LAGFARG');
          const minorClubRkc = lib.trees.find(t => t.id === 'T45_RKC_NORDISK_KLOVER');
          const minorDiamondRkc = lib.trees.find(t => t.id === 'T46_RKC_NORDISK_RUTER');
          if (!A.treeCompatible(heartRkc) || !A.treeCompatible(spadeRkc) || !A.treeCompatible(minorStenberg) || !A.treeCompatible(minorClubRkc) || !A.treeCompatible(minorDiamondRkc)) throw new Error('Stenberg and RKC trees must be compatible with the authoritative system');
          const hit = A.findMatch(lib, [{c:'1N'},{c:'P'},{c:'2D'},{c:'P'},{c:'2H'},{c:'P'}]);
          if (!hit) throw new Error('Analysis library sequence matching failed');
          console.log('Offline analysis engine OK; matched ' + hit.tree.id);
          NODE

      - name: Run correction-engine regression tests
        run: node tests/reverse-hps.test.js
