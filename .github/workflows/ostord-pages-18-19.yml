name: Ostörd budgivning – kärna och sidor 18–19

on:
  push:
    branches:
      - work/theme-dataset-analysis
    paths:
      - 'rattningsmotor.js'
      - 'analysbibliotek.json'
      - 'tests/ostord-*.test.js'
      - 'testdata/weak-two.test.js'
      - 'testdata/weak-two-audit.md'
      - 'LOGG_BUDREGLER.md'
      - '.github/workflows/ostord-pages-18-19.yml'
  workflow_dispatch:

jobs:
  ostord-pages-18-19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kör kärn- och sidtester för ostörd budgivning
        run: node --test tests/ostord-sidor-18-19.test.js tests/ostord-core.test.js
      - name: Kör svag-två-regression inklusive ej täckta hoppbud
        run: node --test testdata/weak-two.test.js
