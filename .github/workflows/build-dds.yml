name: Build local DDS WebAssembly

on:
  push:
    branches:
      - feature/two-player-dds
    paths:
      - '.github/workflows/build-dds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bidding trainer
        uses: actions/checkout@v4
        with:
          ref: feature/two-player-dds

      - name: Check out official DDS source
        uses: actions/checkout@v4
        with:
          repository: dds-bridge/dds
          ref: develop
          path: dds-source

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build, patch and verify official DDS browser module
        working-directory: dds-source
        run: ./web/update_wasm.sh

      - name: Copy complete browser runtime
        run: |
          mkdir -p dds-runtime
          cp dds-source/web/dds_web_wasm.js dds-runtime/
          cp dds-source/web/dds_web_wasm.wasm dds-runtime/
          cp dds-source/web/dds_web_wasm_bin.js dds-runtime/
          cp dds-source/web/coi-serviceworker.js ./coi-serviceworker.js
          test -s dds-runtime/dds_web_wasm.js
          test -s dds-runtime/dds_web_wasm.wasm
          test -s dds-runtime/dds_web_wasm_bin.js
          node -e "const fs=require('fs'); WebAssembly.compile(fs.readFileSync('dds-runtime/dds_web_wasm.wasm')).then(()=>console.log('DDS WebAssembly module compiles successfully'),e=>{console.error(e);process.exit(1)})"

      - name: Commit generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dds-runtime coi-serviceworker.js
          if git diff --cached --quiet; then
            echo "DDS runtime is already up to date"
            exit 0
          fi
          git commit -m "Build official DDS WebAssembly runtime"
          git push
